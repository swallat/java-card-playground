name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gleiche Toolchain wie lokal: JDK und Maven aus mise.toml
      - uses: jdx/mise-action@v4

      - name: Maven-Cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Werkzeugversionen
        run: |
          mise exec -- java -version
          mise exec -- mvn -v

      # Referenz-Tests + Musterloesungen (UebungNNLoesungTest).
      # Die Aufgaben-Geruestklassen (UebungNNAufgaben) werden nur kompiliert, nicht ausgefuehrt.
      - name: Build und Tests (mvn verify)
        run: mise exec -- mvn -B -ntp verify

      - name: Testzusammenfassung
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          rows, tot = [], [0, 0, 0, 0]
          for p in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              r = ET.parse(p).getroot()
              v = [int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped')]
              tot = [a + b for a, b in zip(tot, v)]
              ok = '✅' if v[1] == 0 and v[2] == 0 else '❌'
              rows.append(f"| {ok} | `{r.get('name')}` | {v[0]} | {v[1]} | {v[2]} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as o:
              o.write(f"## Tests: {tot[0]} gesamt, {tot[1]} fehlgeschlagen, {tot[2]} Fehler, {tot[3]} übersprungen\n\n")
              o.write("| | Klasse | Tests | Fehlgeschl. | Fehler |\n|---|---|---|---|---|\n")
              o.write("\n".join(rows) + "\n")
          EOF

      - name: Testreports hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: JAR hochladen
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar

  release:
    name: Release (bei Tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - name: Doku-Paket bauen
        run: zip -r dist/java-card-playground-doku.zip README.md apdu-cheatsheet.md docs aufgaben LICENSE LICENSE-CC-BY-4.0.txt

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Java Card Playground $GITHUB_REF_NAME" \
            --generate-notes
